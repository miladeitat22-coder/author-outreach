name: outreach-worker
on:
  schedule: [{ cron: "0 */3 * * *" }]
  workflow_dispatch: {}
concurrency: outreach
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r worker/requirements.txt && playwright install --with-deps chromium
      - run: python worker/pipeline.py all
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDERS_JSON: ${{ secrets.SENDERS_JSON }}
          PLATFORM_SESSIONS_JSON: ${{ secrets.PLATFORM_SESSIONS_JSON }}
          PORTFOLIO_URL: ${{ vars.PORTFOLIO_URL }}
          STUDIO_NAME: ${{ vars.STUDIO_NAME }}
          OWNER_NAME: ${{ vars.OWNER_NAME }}
